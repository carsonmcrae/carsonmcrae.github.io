<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<!-- Purpose: Illustrate Recalen's capture-to-recall workflow. Scope: Example content and product concepts. Does NOT belong: A replica application screen or real user content. -->
<title id="title">Recalen: capture now, recall later</title>
<desc id="desc">A diagram connecting a captured idea to temporary or permanent storage and later recall through search, reminders, or related entries.</desc>
<rect width="1200" height="675" fill="#eaf0ff"/>
<circle cx="1080" cy="65" r="250" fill="#e1e9fc"/>
<circle cx="25" cy="675" r="280" fill="#e1e9fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#19294d">
<text x="75" y="82" font-size="15" letter-spacing="3" font-weight="600">RECALEN / CAPTURE TO RECALL</text>
<text x="75" y="155" font-size="47" letter-spacing="-1" font-family="Georgia,serif">Less to hold in your head.</text>
<g stroke="#7188b8" stroke-width="2" fill="none">
<path d="M355 346H420M409 337L420 346 409 355M750 346H815M804 337L815 346 804 355"/>
</g>
<rect x="75" y="228" width="280" height="266" rx="12" fill="white" stroke="#bac9e7"/>
<text x="101" y="269" font-size="13" fill="#4b6088" letter-spacing="2">01 / CAPTURE</text>
<text x="101" y="321" font-size="21" font-weight="600">A thought worth saving.</text>
<text x="101" y="363" font-size="16" fill="#4b6088">Text, a link, a file,</text>
<text x="101" y="390" font-size="16" fill="#4b6088">or a voice note.</text>
<rect x="101" y="425" width="225" height="39" rx="5" fill="#edf2ff"/>
<text x="116" y="450" font-size="14" fill="#284ca1">Keep the original context.</text>
<rect x="420" y="228" width="330" height="266" rx="12" fill="white" stroke="#bac9e7"/>
<text x="448" y="269" font-size="13" fill="#4b6088" letter-spacing="2">02 / KEEP WHAT MATTERS</text>
<text x="448" y="321" font-size="21" font-weight="600">Temporary or permanent.</text>
<text x="448" y="363" font-size="16" fill="#4b6088">Organize when it helps.</text>
<text x="448" y="390" font-size="16" fill="#4b6088">Your corrections stay yours.</text>
<rect x="448" y="425" width="273" height="39" rx="5" fill="#edf2ff"/>
<text x="463" y="450" font-size="14" fill="#284ca1">Assistance with a human final say.</text>
<rect x="815" y="228" width="310" height="266" rx="12" fill="#213d78"/>
<text x="843" y="269" font-size="13" fill="#d4e0ff" letter-spacing="2">03 / RECALL</text>
<text x="843" y="321" font-size="21" font-weight="600" fill="white">Come back to the idea.</text>
<text x="843" y="363" font-size="16" fill="#d4e0ff">Search. A reminder.</text>
<text x="843" y="390" font-size="16" fill="#d4e0ff">A related entry.</text>
<rect x="843" y="425" width="253" height="39" rx="5" fill="#354f89"/>
<text x="858" y="450" font-size="14" fill="white">Find it when it becomes useful.</text>
<path d="M109 550H1095" stroke="#bac9e7"/>
<text x="75" y="602" font-size="15" fill="#4b6088">Illustrated product workflow. Example content.</text>
<text x="1125" y="602" text-anchor="end" font-size="15" fill="#4b6088">Designed and built by Carson McRae</text>
</g></svg>
